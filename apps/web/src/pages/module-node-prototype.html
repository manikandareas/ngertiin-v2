<style>
:root{font-family:Nunito,'Avenir Next',ui-rounded,system-ui,sans-serif;color:#243b46;background:#fff;font-synthesis:none;--ink:#243b46;--muted:#586f79;--line:#dde7eb;--brand:#1cb0f6;--blue:#116e98;--pale:#eef8fc;--green:#286845}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}button:hover{filter:brightness(.96)}button:active{transform:translateY(1px)}:focus-visible{outline:3px solid var(--blue);outline-offset:5px}h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p{line-height:1.75}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.shell{min-height:calc(100dvh - 90px);padding:0 48px}.top{max-width:1300px;margin:auto;padding:28px 0;display:flex;justify-content:flex-end}.icon{border:0;background:transparent;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}.book{max-width:1120px;margin:65px auto 0;display:grid;grid-template-columns:280px minmax(0,1fr);gap:100px;min-height:570px}.cover{padding:9px 0}.cover h2{font-size:28px;line-height:1.15;letter-spacing:-.5px;max-width:240px;font-weight:750}.book-tabs{margin-top:40px;display:flex;flex-direction:column;gap:16px;font-size:12px;color:var(--muted)}.book-tab{display:flex;align-items:center;gap:12px}.book-tab svg{width:14px;height:14px}.book-tab.active{color:var(--blue);font-weight:750}.workspace{min-width:0;display:flex;flex-direction:column}.content{flex:1;padding-bottom:30px}.summary{max-width:580px;margin:0 auto}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--blue)}h1{font-size:32px;font-weight:750;letter-spacing:-.7px;line-height:1.3;margin-top:16px}h2{font-size:16px}h3{font-size:13px;font-weight:750}.muted{color:var(--muted)}.scoreline{display:flex;align-items:center;gap:24px;margin:24px 0}.score{font-size:64px;line-height:1;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}.score small{font-size:22px;font-weight:550;color:var(--muted);letter-spacing:0}.score-meta{display:flex;flex-direction:column;gap:8px;font-size:13px}.xp{color:var(--green);font-weight:750}.feedback{font-size:14px;color:var(--muted)}.feedback strong{color:var(--ink)}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px}.feedback-block h3{display:flex;align-items:center;gap:8px;color:var(--ink)}.feedback-block h3 svg{width:16px;height:16px}.feedback-block:first-child h3{color:var(--green)}.feedback-block ul{padding-left:17px;margin:10px 0 0;font-size:13px;line-height:1.8;color:var(--muted)}.concepts{margin-top:30px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.section-head span{font-size:11px;color:var(--muted)}details{margin-top:18px;font-size:12px;color:var(--muted)}summary{cursor:pointer;width:fit-content;padding:4px 0}.detail-row{padding:10px 0;line-height:1.7;border-bottom:1px solid var(--line)}.footer{max-width:580px;width:100%;margin:0 auto;padding:20px 0 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}.footer p{font-size:12px;color:var(--muted)}.footer p strong{display:block;color:var(--ink);font-size:13px}.primary{display:inline-flex;justify-content:center;align-items:center;gap:18px;min-height:50px;border:0;border-radius:50px;background:var(--brand);color:#093c53;padding:14px 24px;font-weight:750;font-size:13px}.secondary{border:1px solid var(--line);border-radius:50px;background:white;padding:12px 18px;font-size:13px}.lab-space{height:100px}.lab{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#edf2f4;padding:5px;border-radius:50px;max-width:calc(100% - 24px);z-index:2}.lab-label{font-size:9px;letter-spacing:1px;padding:0 12px;color:var(--muted);white-space:nowrap}.lab button{min-height:42px;white-space:nowrap;border:0;border-radius:50px;background:transparent;padding:0 15px;font-size:11px;color:var(--muted)}.lab button[aria-pressed=true]{background:white;color:var(--ink)}.state-picker{position:absolute;top:40px;left:48px;font-size:11px;display:flex;align-items:center;gap:10px;color:var(--muted)}select{background:white;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px}.ring-hero{display:flex;align-items:center;gap:28px;background:var(--pale);padding:24px;border-radius:22px;margin:24px 0}.ring{width:120px;height:120px;position:relative;flex-shrink:0;display:grid;place-items:center}.ring svg{width:120px;height:120px;position:absolute;inset:0;transform:rotate(-90deg);stroke-width:7}.ring .track{stroke:#d9eaf1}.ring .value{stroke:#168bbc;stroke-dasharray:80 100}.ring strong{font-size:32px;letter-spacing:-1px}.ring strong small{font-size:14px;letter-spacing:0}.ring-copy{font-size:13px;line-height:1.7}.ring-copy strong{display:block;font-size:20px;margin-bottom:4px}.ring-copy .xp{display:block;margin-top:10px}.variant-B .feedback-grid{padding-top:22px;border-top:1px solid var(--line)}.notes-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:24px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.notes-hero .score{font-size:40px}.notes-hero .score small{font-size:18px}.notes-hero .score-meta{flex-direction:row;gap:20px}.variant-C .feedback{font-size:17px;color:var(--ink)}.variant-C .feedback-grid{display:block;margin-top:22px}.variant-C .feedback-block{padding:0 0 0 18px;border-left:2px solid #8db99a;margin-top:18px}.variant-C .feedback-block+ .feedback-block{border-color:#b4c8d1}.variant-C .feedback-block ul{list-style:none;padding:0;margin-top:6px}.status{padding:32px 0}.status h1{font-size:28px}.status p{font-size:14px;color:var(--muted);margin-top:18px;max-width:440px}.status-icon{display:grid;place-items:center;width:48px;height:48px;background:var(--pale);color:var(--blue);border-radius:16px;margin-bottom:24px}.failed .status-icon{background:#fff0ed;color:#a03f2c}.skeleton{margin-top:32px;display:grid;gap:14px}.skeleton span{height:12px;background:#edf2f4;border-radius:4px}.skeleton span:nth-child(2){width:82%}.skeleton span:nth-child(3){width:60%}dialog{border:1px solid var(--line);border-radius:22px;padding:28px;color:var(--ink);max-width:420px;width:calc(100% - 40px)}dialog::backdrop{background:#243b4640}dialog p{font-size:14px;color:var(--muted);margin:14px 0 24px}dialog button{float:right}
@media(min-width:1450px){.book{min-height:620px}}@media(max-width:1000px){.book{grid-template-columns:200px minmax(0,1fr);gap:48px}}@media(max-width:640px){.shell{padding:0 24px}.top{padding:18px 0}.state-picker{top:28px;left:24px}.state-picker label{display:none}.book{display:block;margin:12px 0 0;min-height:0}.cover{padding:0 0 32px}.cover h2{font-size:16px;max-width:none}.book-tabs{margin-top:20px;flex-direction:row;gap:18px;font-size:11px}.book-tab{gap:6px}.book-tab svg{display:none}.content{padding:22px 0 20px}h1{font-size:28px}.score{font-size:56px}.feedback-grid{gap:20px}.footer{padding:20px 0 28px;align-items:flex-start;flex-direction:column}.footer .primary{width:100%}.lab-label{display:none}.lab{gap:0}.lab button{padding:0 10px;font-size:10px}.ring-hero{padding:20px 16px;gap:18px}.ring,.ring svg{width:100px;height:100px}.ring-copy strong{font-size:17px}.notes-hero .score-meta{flex-direction:column;gap:6px}.section-head span{font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Three presentations of the same API activity results. */
.reviews{margin-top:30px}.reviews>h2{margin-bottom:6px}.review{padding:18px 0;border-bottom:1px solid var(--line)}.review:last-child{border-bottom:0}.review-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.review-heading h3{display:flex;align-items:center;gap:9px;font-size:13px}.review-heading svg{width:16px;height:16px}.review-status{font-size:11px;font-weight:700;color:var(--green)}.incorrect .review-status{color:#875116}.review-points{font-size:11px;color:var(--muted);white-space:nowrap}.review p{font-size:13px;line-height:1.75;color:var(--muted);margin-top:10px}.variant-B .review{padding:18px 20px;margin-top:14px;border:0;border-radius:16px;background:#f2f8f5}.variant-B .review.incorrect{background:#fbf6ed}.variant-C .review{padding-left:18px;border-left:2px solid #8db99a;border-bottom:0;margin-top:20px}.variant-C .review.incorrect{border-left-color:#c8a16d}.concept-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.concept-tags span{border:1px solid var(--line);border-radius:50px;padding:6px 11px;font-size:12px;color:var(--muted)}.feedback-section{margin-top:24px}.variant-C .feedback{font-size:15px}.feedback-grid:empty{display:none}.state-picker{flex-wrap:wrap;max-width:calc(100% - 110px)}.state-picker select{max-width:100%}
@media(max-width:640px){.feedback-grid{grid-template-columns:1fr;gap:18px}.review-heading{flex-wrap:wrap}.state-picker{top:24px}.cover{padding-top:16px}}

.action-footer{max-width:580px;width:100%;margin:0 auto;padding:24px 0 32px;border-top:1px solid var(--line)}.action-footer .primary{border-radius:16px;box-shadow:0 4px 0 #008acb;color:white;min-height:50px;flex-shrink:0}.action-link{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:650;min-height:40px;padding:8px 0;text-align:left}.action-link:hover{color:var(--blue)}.action-link svg{width:15px;height:15px}.split-row{display:flex;align-items:center;justify-content:space-between;gap:24px}.split-row .other-actions{display:flex;flex-direction:column;gap:2px}.full-width{display:flex;flex-direction:column;gap:22px}.full-width>.primary{order:-1;width:100%}.full-width .other-actions{display:grid;grid-template-columns:1fr 1fr;gap:20px}.full-width .action-link{justify-content:center;text-align:center}.full-width .action-link+.action-link{border-left:1px solid var(--line);padding-left:20px}.compact{display:flex;justify-content:flex-end;align-items:center;gap:12px}.more-actions{position:relative;margin:0}.more-actions>summary{list-style:none;display:grid;place-items:center;width:50px;height:50px;border:1px solid var(--line);border-radius:16px;font-size:18px;letter-spacing:2px;padding:0}.more-actions>summary::-webkit-details-marker{display:none}.more-actions[open]>summary{background:var(--pale)}.action-menu{position:absolute;bottom:62px;right:0;background:white;border:1px solid var(--line);border-radius:16px;padding:8px;min-width:260px;box-shadow:0 8px 30px #243b4615;z-index:3}.action-menu .action-link{padding:12px;width:100%;border-radius:10px}.action-menu .action-link:hover{background:var(--pale)}
@media(max-width:640px){.split-row{flex-direction:column;align-items:stretch;gap:18px}.split-row>.primary{order:-1}.split-row .other-actions{align-items:flex-start}.full-width .other-actions{gap:12px}.full-width .action-link+.action-link{padding-left:12px}.compact>.primary{flex:1;min-width:0;padding:14px;font-size:12px}.action-footer .primary{white-space:normal}.action-menu{min-width:250px}}
</style>
</head>
<body>
<div class="state-picker"><label for="state">Preview status</label><select id="state"><option value="completed">Selesai · dengan feedback</option><option value="no-feedback">Selesai · tanpa feedback</option><option value="module-completed">Modul selesai</option><option value="no-next">Tanpa langkah berikutnya</option><option value="evaluating">Sedang dievaluasi</option><option value="failed">Evaluasi gagal · sementara</option><option value="failed-final">Evaluasi gagal · tidak dapat diulang</option></select></div>
<div id="app"></div><div class="lab-space"></div>
<nav class="lab" aria-label="Variasi layout actions"><span class="lab-label">ACTIONS</span><button type="button" data-variant="A">01 · Split Row</button><button type="button" data-variant="B">02 · Full Width</button><button type="button" data-variant="C">03 · Compact Menu</button></nav>
<dialog id="preview-dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">Preview hasil belajar</h2><p id="dialog-copy">Ini prototype dengan data simulasi sesuai kontrak hasil attempt.</p><button type="button" class="primary" id="close-dialog">Kembali ke hasil</button></dialog>
<script>
const icons={close:'<path d="m6 6 12 12M6 18 18 6"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',alert:'<path d="M12 8v5m0 3h.01"/><circle cx="12" cy="12" r="9"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
// Local simulated data using only fields present in AttemptResult.
// The fixture intentionally picks attempt, xpAwarded and nextAction; no progress data is rendered.
const identity={id:'00000000-0000-4000-8000-000000000001',submissionId:'00000000-0000-4000-8000-000000000002',attemptNumber:1,createdAt:'2026-09-07T01:00:00.000Z'};
const completed={...identity,evaluationStatus:'completed',evaluatedAt:'2026-09-07T01:00:10.000Z',score:8,maxScore:10,normalizedScore:.8,policyOutcome:'optional_review',feedback:{summary:'Kamu sudah memahami arah perpindahan air pada osmosis. Yuk, pertajam lagi cara mengenali larutan hipertonik.',strengths:['Menentukan arah perpindahan air.','Memahami peran membran semipermeabel.'],areasToImprove:['Membedakan larutan hipertonik dan hipotonik.']},activityResults:[{activityId:'00000000-0000-4000-8000-000000000003',correct:true,score:5,maxScore:5,explanation:'Air bergerak melalui membran semipermeabel dari larutan encer menuju larutan yang lebih pekat.'},{activityId:'00000000-0000-4000-8000-000000000004',correct:false,score:3,maxScore:5,explanation:'Arah perpindahan air sudah tepat. Namun, larutan hipertonik berarti lebih pekat dibandingkan cairan di dalam sel, bukan lebih encer.'}],conceptResults:[{conceptKey:'osmosis',performanceScore:1,masteryScore:.85,confidenceScore:.8,evidenceCount:4},{conceptKey:'larutan_hipertonik',performanceScore:.6,masteryScore:.6,confidenceScore:.6,evidenceCount:3}]};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!['A','B','C'].includes(variant))variant='A';let state='completed';
const pct=n=>Math.round(n*100);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const title=s=>esc(s.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase()));
function fixture(){
 const moduleId='00000000-0000-4000-8000-000000000005';
 if(state==='evaluating')return {attempt:{...identity,evaluationStatus:'evaluating'},xpAwarded:0,nextAction:{type:'none'}};
 if(state.startsWith('failed'))return {attempt:{...identity,evaluationStatus:'failed',evaluatedAt:completed.evaluatedAt,failure:{code:'ATTEMPT_EVALUATION_FAILED',message:'Evaluasi jawaban belum berhasil.',retryable:state==='failed'}},xpAwarded:0,nextAction:{type:'none'}};
 const attempt=structuredClone(completed);
 if(state==='no-feedback'){
  attempt.feedback=null;attempt.score=5;attempt.normalizedScore=.5;attempt.activityResults[1]={...attempt.activityResults[1],score:0,explanation:'Larutan hipertonik lebih pekat dibandingkan cairan di dalam sel. Air keluar dari sel menuju larutan tersebut.'};
 }
 return {attempt,xpAwarded:25,nextAction:state==='no-next'?{type:'none'}:state==='module-completed'?{type:'module_completed',moduleId}:{type:'offer_optional_review',attemptId:identity.id,interventionId:'00000000-0000-4000-8000-000000000006'}};
}
let result=fixture();
function score(){const a=result.attempt;return `<div class="ring-hero"><div class="ring" aria-label="Skor ${pct(a.normalizedScore)} persen"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="51"/><circle class="value" cx="60" cy="60" r="51" pathLength="100" style="stroke-dasharray:${pct(a.normalizedScore)} 100"/></svg><strong>${pct(a.normalizedScore)}<small>%</small></strong></div><div class="ring-copy"><strong>Hasil belajarmu.</strong><span>${a.score} dari ${a.maxScore} poin tercapai</span><span class="xp">+${result.xpAwarded} XP diperoleh</span></div></div>`}

function feedback(){const f=result.attempt.feedback;if(!f)return '';return `<section class="feedback-section" aria-label="Feedback"><p class="feedback">${esc(f.summary)}</p><div class="feedback-grid">${f.strengths.length?`<div class="feedback-block"><h3>${icon('check')}Yang sudah kuat</h3><ul>${f.strengths.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}${f.areasToImprove.length?`<div class="feedback-block"><h3>${icon('arrow')}Yang perlu dilatih</h3><ul>${f.areasToImprove.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}</div></section>`}
function reviews(){const rows=result.attempt.activityResults;if(!rows.length)return '';return `<section class="reviews"><h2>Ulasan jawaban</h2>${rows.map((r,i)=>`<article class="review ${r.correct?'correct':'incorrect'}"><div class="review-heading"><h3>${icon(r.correct?'check':'arrow')}Soal ${i+1}<span class="review-status">${r.correct?'Benar':r.score>0?'Sebagian tepat':'Belum tepat'}</span></h3><span class="review-points">${r.score} / ${r.maxScore} poin</span></div>${r.explanation?`<p>${esc(r.explanation)}</p>`:''}</article>`).join('')}</section>`}
function concepts(){const rows=result.attempt.conceptResults;return rows.length?`<section class="concepts"><h2>Konsep yang dinilai</h2><div class="concept-tags">${rows.map(c=>`<span>${title(c.conceptKey)}</span>`).join('')}</div></section>`:''}
function summaryContent(){const a=result.attempt;if(a.evaluationStatus!=='completed'){const failed=a.evaluationStatus==='failed';return `<section class="status ${failed?'failed':''}" role="status"><div class="status-icon">${icon(failed?'alert':'clock')}</div><div class="eyebrow">Hasil assessment</div><h1>${failed?'Evaluasi belum berhasil':'Jawabanmu sedang dievaluasi.'}</h1><p>${failed?esc(a.failure.message):'Hasil akan tersedia setelah evaluasi selesai.'}</p>${failed?`<p>${a.failure.retryable?'Jawabanmu sudah tersimpan. Buka kembali halaman ini beberapa saat lagi.':'Jawabanmu tetap tersimpan, tetapi hasil belajar belum diperbarui.'}</p>`:'<div class="skeleton" aria-hidden="true"><span></span><span></span><span></span></div>'}</section>`;}return `<section class="summary variant-B" aria-label="Hasil assessment"><div class="eyebrow">Hasil assessment</div><h1>Assessment selesai.</h1>${score()}${feedback()}${reviews()}${concepts()}</section>`}
// Labels map NextLearningAction.type; do not invent the topic of the next node.
const actions={wait_for_module:['Modul sedang disiapkan','Lihat modul'],retry_module:['Pembuatan modul perlu dicoba lagi','Lihat modul'],start_core_node:['Materi berikutnya','Lanjutkan belajar'],resume_core_node:['Lanjutkan materi','Lanjutkan belajar'],start_adaptive_node:['Latihan penguatan','Mulai latihan penguatan'],resume_adaptive_node:['Lanjutkan latihan penguatan','Lanjutkan latihan penguatan'],offer_optional_review:['Penguatan opsional','Lihat pilihan penguatan'],wait_for_adaptive:['Penguatan sedang disiapkan','Lihat status'],module_completed:['Modul selesai','Lihat perjalanan belajar']};
function footer(){
 if(result.attempt.evaluationStatus!=='completed')return '';
 const action=actions[result.nextAction.type];
 const primary=action?`<button type="button" class="primary" id="next">${action[1]} ${icon('arrow')}</button>`:'';
 const review=`<button type="button" class="action-link" data-action="review">Lihat kembali materi &amp; soal</button>`;
 const retry=`<button type="button" class="action-link" data-action="retry">${icon('clock')}Kerjakan ulang assessment</button>`;
 if(variant==='C')return `<footer class="action-footer compact">${primary}<details class="more-actions"><summary aria-label="Pilihan belajar lainnya">•••</summary><div class="action-menu">${review}${retry}</div></details></footer>`;
 return `<footer class="action-footer ${variant==='A'?'split-row':'full-width'}"><div class="other-actions">${review}${retry}</div>${primary}</footer>`;
}
function render(){result=fixture();document.querySelector('#app').innerHTML=`<div class="shell"><header class="top"><button type="button" class="icon" id="exit" aria-label="Keluar dari hasil">${icon('close')}</button></header><div class="book"><aside class="cover"><h2>Osmosis dalam kehidupan</h2><div class="book-tabs"><div class="book-tab">01 &nbsp; Pahami ${icon('check')}</div><div class="book-tab">02 &nbsp; Ingat ${icon('check')}</div><div class="book-tab active" aria-current="step">03 &nbsp; Coba ${icon('check')}</div></div></aside><div class="workspace"><main class="content">${summaryContent()}</main>${footer()}</div></div></div>`;document.querySelectorAll('[data-variant]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.variant===variant))});document.querySelector('#exit').onclick=()=>showDialog(true);const next=document.querySelector('#next');if(next)next.onclick=()=>showDialog(false);document.querySelectorAll('[data-action]').forEach(b=>{b.onclick=()=>{document.querySelector('#dialog-title').textContent=b.dataset.action==='review'?'Lihat kembali materi & soal':'Kerjakan ulang assessment';document.querySelector('#dialog-copy').textContent=b.dataset.action==='review'?'Di aplikasi, aksi ini membuka kembali aktivitas node untuk dipelajari.':'Di aplikasi, aksi ini memulai assessment baru dengan jawaban kosong.';document.querySelector('dialog').showModal()}})}
function showDialog(exit){document.querySelector('#dialog-title').textContent=exit?'Preview hasil belajar':actions[result.nextAction.type][0];document.querySelector('#dialog-copy').textContent=exit?'Ini prototype dengan data simulasi. Tutup dialog untuk kembali membandingkan tiga variasi hasil belajar.':'Ini akhir alur prototype. Di aplikasi, tombol ini membuka halaman sesuai langkah belajar berikutnya.';document.querySelector('dialog').showModal()}
function change(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
document.querySelectorAll('[data-variant]').forEach(b=>{b.onclick=()=>change(b.dataset.variant)});document.querySelector('#state').onchange=e=>{state=e.target.value;render()};document.querySelector('#close-dialog').onclick=()=>document.querySelector('dialog').close();document.addEventListener('keydown',e=>{if(document.querySelector('dialog').open||e.target.closest('select,summary')||e.altKey||e.ctrlKey||e.metaKey)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();change(['A','B','C'][(['A','B','C'].indexOf(variant)+(e.key==='ArrowRight'?1:2))%3]);document.querySelector(`[data-variant="${variant}"]`).focus()}});render();
</script>
</body></html>
