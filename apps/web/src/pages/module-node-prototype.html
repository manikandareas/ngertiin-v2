:root{--bg:#fff}

<body>
<div id="app"></div><div class="lab-space"></div>
<nav class="lab" aria-label="Pilihan variasi prototype"><span class="lab-label">LAYOUT LAB</span><button type="button" class="arrow" data-cycle="-1" aria-label="Variasi sebelumnya">←</button><button type="button" data-variant="A">01 · Open Canvas</button><button type="button" data-variant="B">02 · Quiet Split</button><button type="button" data-variant="C">03 · Side Control</button><button type="button" class="arrow" data-cycle="1" aria-label="Variasi berikutnya">→</button></nav>
<dialog id="exit-dialog"><h2>Jeda sebentar?</h2><p>Ini preview layout. Kamu bisa kembali ke awal untuk mencoba alurnya lagi.</p><div class="row"><button type="button" class="secondary" id="stay">Tetap belajar</button><button type="button" class="primary" id="restart">Mulai ulang</button></div></dialog>
<script>
const icons={arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',check:'<path d="m5 12 4 4L19 6"/>',flip:'<path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-2l2 3M4 16l2 3a7 7 0 0 0 12-2"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!['A','B','C'].includes(variant))variant='A';
let step=0,flipped=false,answer=null,result=false;
const labels=['Pahami','Ingat','Coba'];
function progress(){return `<div class="progress" role="progressbar" aria-label="Posisi aktivitas" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${result?3:step+1}">${labels.map((_,i)=>`<span class="${i<=(result?2:step)?'filled':''}"></span>`).join('')}</div>`}
function activity(){if(result)return `<article class="activity"><div class="result-mark">${icon('check')}</div><div class="eyebrow">Node selesai · hasil simulasi</div><h1>Satu konsep baru.<br>Satu langkah maju.</h1><p class="lead">${answer===1?'Betul! Air bergerak melewati membran menuju larutan yang lebih pekat.':'Hampir! Pada osmosis, yang berpindah adalah air, menuju larutan yang lebih pekat.'}</p><p class="result-note"><strong>Ingat kata kuncinya: air + membran.</strong><br><small>Kamu sudah membaca materi, mengingat konsep, dan mencoba satu soal.</small></p></article>`;
if(step===0)return `<article class="activity"><div class="eyebrow">Materi</div><h1>Kenapa kismis mengembang di air?</h1><p class="lead">Air masuk ke dalam sel kismis melalui <strong>osmosis</strong>: perpindahan air dari larutan encer ke larutan lebih pekat.</p><div class="diagram" aria-label="Air bergerak dari larutan encer menuju larutan pekat"><div><div class="molecule"><span class="bubble">H₂O</span></div><strong>Lebih encer</strong><small>Di luar sel</small></div>${icon('arrow')}<div><div class="molecule"><span class="bubble"></span><span class="bubble">H₂O</span><span class="bubble"></span></div><strong>Lebih pekat</strong><small>Di dalam sel</small></div></div><p class="note">Membran sel meloloskan air, tetapi tidak semua zat terlarut.</p></article>`;
if(step===1)return `<article class="activity"><div class="eyebrow">Flashcard</div><h1>Ingat kembali osmosis.</h1><button type="button" class="flash" id="flip" aria-pressed="${flipped}"><span class="eyebrow">${flipped?'Jawaban':'Pertanyaan'} · 1 / 1</span><strong>${flipped?'Air bergerak melalui membran semipermeabel, dari larutan encer ke larutan lebih pekat.':'Apa yang berpindah dalam proses osmosis?'}</strong>${icon('flip')}</button><p class="flash-hint">Klik kartu untuk melihat ${flipped?'pertanyaan':'jawaban'}</p></article>`;
return `<article class="activity"><div class="eyebrow">Cek pemahaman</div><h1>Ke mana air bergerak?</h1><p class="lead">Sel berada di dalam larutan yang lebih pekat daripada cairan di dalam sel. Apa yang terjadi?</p><div class="answers" role="group" aria-label="Pilihan jawaban">${['Air masuk ke dalam sel','Air keluar dari sel','Air tidak berpindah'].map((t,i)=>`<button type="button" class="answer ${answer===i?'selected':''}" data-answer="${i}" aria-pressed="${answer===i}"><b>${String.fromCharCode(65+i)}</b>${t}</button>`).join('')}</div></article>`}
function footer(){const text=result?'Ulangi eksplorasi':step===2?'Kirim jawaban':'Lanjutkan';return `<footer class="footer"><span class="foot-hint">${result?'Pelan-pelan juga tetap maju.':step===0?'Pahami dulu. Nggak perlu buru-buru.':step===1?'Balik kartu, ingat, lalu lanjut.':answer===null?'Pilih satu jawaban untuk melanjutkan.':'Sudah yakin? Kirim jawabanmu.'}</span><button type="button" class="icon back" id="back" aria-label="Aktivitas sebelumnya" ${step===0&&!result?'disabled':''}>${icon('back')}</button><button type="button" class="primary" id="next" ${step===2&&answer===null&&!result?'disabled':''}><span class="cta-text">${text}</span>${icon(step===2&&!result?'check':'arrow')}</button></footer>`}
function render(){const exit=`<button type="button" class="icon" id="exit" aria-label="Keluar dari node">${icon('close')}</button>`;const brand='<div class="brand">ngerti<span>.in</span></div>';const workspace=`<div class="workspace"><main class="content" id="content" tabindex="-1">${activity()}</main>${variant==='C'?'':footer()}</div>`;
if(variant==='A')document.querySelector('#app').innerHTML=`<div class="shell trail"><header class="top">${brand}<div class="row"><span class="top-title">Biologi sel / Transport membran</span>${exit}</div></header><aside class="rail"><span class="eyebrow muted">Ruang belajar / 04</span><h2>Osmosis dalam kehidupan</h2><div class="steps">${labels.map((t,i)=>`<div class="step ${step===i&&!result?'active':''}" ${step===i&&!result?'aria-current="step"':''}><b>${i<step||result?icon('check'):'0'+(i+1)}</b><span>${t}</span></div>`).join('')}</div><p class="rail-note">Sedikit demi sedikit,<br>jadi makin ngerti.</p><span class="prototype-note">Prototype A · Trail Rail</span></aside>${workspace}</div>`;
if(variant==='B')document.querySelector('#app').innerHTML=`<div class="shell spread"><header class="top">${brand}<span class="top-title">Biologi sel · Buku belajarmu</span>${exit}</header><div class="book"><aside class="cover"><span class="eyebrow">Bab kecil, ide besar</span><div class="big-number">04</div><h2>Osmosis dalam kehidupan</h2><p>Dari kismis di dapur sampai sel di tubuhmu. Yuk, kenali cara air bergerak.</p><div class="book-tabs">${labels.map((t,i)=>`<div class="book-tab ${i===step?'active':''}"><span>0${i+1} &nbsp; ${t}</span><span>${i<step||result?'✓':i===step?'Sekarang':'—'}</span></div>`).join('')}</div></aside>${workspace}</div><p class="prototype-note" style="max-width:1180px;margin:20px auto 0">Prototype B · Study Spread</p></div>`;
if(variant==='C')document.querySelector('#app').innerHTML=`<div class="shell stage"><header class="top">${exit}<div class="island"><span class="top-title">Osmosis dalam kehidupan</span>${progress()}<small>${result?3:step+1}/3</small></div>${brand}</header><div class="stage-grid">${workspace}${footer()}</div><div class="stage-caption">${icon('spark')}<span>Satu hal dalam satu waktu. Kamu bisa.</span></div><p class="prototype-note" style="text-align:center;margin-top:18px">Prototype C · Focus Stage</p></div>`;
document.querySelectorAll('[data-variant]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.variant===variant)});
document.querySelector('#next').onclick=()=>{if(result){step=0;result=false;answer=null;flipped=false}else if(step<2){step++}else result=true;render();document.querySelector('#content').focus({preventScroll:true});window.scrollTo(0,0)};
document.querySelector('#back').onclick=()=>{if(result)result=false;else step=Math.max(0,step-1);render()};
document.querySelector('#exit').onclick=()=>document.querySelector('dialog').showModal();
const flip=document.querySelector('#flip');if(flip)flip.onclick=()=>{flipped=!flipped;render();document.querySelector('#flip').focus({preventScroll:true})};
document.querySelectorAll('[data-answer]').forEach(b=>{b.onclick=()=>{answer=Number(b.dataset.answer);render();document.querySelector(`[data-answer="${answer}"]`).focus({preventScroll:true})}});}
function change(v){variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render()}
function cycle(n){change(['A','B','C'][(['A','B','C'].indexOf(variant)+n+3)%3])}
document.querySelectorAll('[data-variant]').forEach(b=>{b.onclick=()=>change(b.dataset.variant)});document.querySelectorAll('[data-cycle]').forEach(b=>{b.onclick=()=>cycle(Number(b.dataset.cycle))});
document.addEventListener('keydown',e=>{if(document.querySelector('dialog').open||e.target.closest('input,textarea,select,[contenteditable]')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
document.querySelector('#stay').onclick=()=>document.querySelector('dialog').close();document.querySelector('#restart').onclick=()=>{step=0;flipped=false;answer=null;result=false;document.querySelector('dialog').close();render()};render();
</script>
</body></html>
