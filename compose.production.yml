name: ngertiin-production

x-infrastructure: &infrastructure
  DATABASE_URL: ${DATABASE_URL:?Set internal PostgreSQL URL}
  REDIS_URL: ${REDIS_URL:?Set internal Redis URL}
  S3_ENDPOINT: ${S3_ENDPOINT:?Set R2 S3 endpoint}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set R2 access key}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set R2 secret key}
  S3_BUCKET: ${S3_BUCKET:?Set private R2 bucket}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

x-service: &service
  restart: unless-stopped
  init: true
  stop_grace_period: 120s
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *service
    image: ${BACKEND_IMAGE:?Set registry image prefix}-api:${RELEASE_TAG:?Set immutable commit tag}
    environment:
      <<: *infrastructure
      NODE_ENV: production
      API_PORT: "3000"
      WEB_ORIGIN: https://app-ngertiin.whoismanik.dev
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set Clerk production secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OpenAI key}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      KNOWLEDGE_INDEX_VERSION: ${KNOWLEDGE_INDEX_VERSION:-1}
      KNOWLEDGE_CHUNK_TOKENS: ${KNOWLEDGE_CHUNK_TOKENS:-600}
      KNOWLEDGE_CHUNK_OVERLAP_TOKENS: ${KNOWLEDGE_CHUNK_OVERLAP_TOKENS:-80}
      KNOWLEDGE_SEARCH_CANDIDATES: ${KNOWLEDGE_SEARCH_CANDIDATES:-20}
      KNOWLEDGE_SEARCH_TOP_K: ${KNOWLEDGE_SEARCH_TOP_K:-6}
      KNOWLEDGE_RRF_K: ${KNOWLEDGE_RRF_K:-60}
      KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:-32}
      KNOWLEDGE_INDEX_CONCURRENCY: ${KNOWLEDGE_INDEX_CONCURRENCY:-2}
      KNOWLEDGE_RECONCILE_INTERVAL_MS: ${KNOWLEDGE_RECONCILE_INTERVAL_MS:-60000}
      KNOWLEDGE_OBSOLETE_RETENTION_HOURS: ${KNOWLEDGE_OBSOLETE_RETENTION_HOURS:-24}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Set Mistral key}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:?Set validated chat model}
      CHAT_INPUT_MAX_CODE_POINTS: ${CHAT_INPUT_MAX_CODE_POINTS:-8000}
      CHAT_CONTEXT_MAX_REFERENCES: ${CHAT_CONTEXT_MAX_REFERENCES:-5}
      CHAT_CONTEXT_MAX_CODE_POINTS: ${CHAT_CONTEXT_MAX_CODE_POINTS:-12000}
      CHAT_PROMPT_MAX_TOKENS: ${CHAT_PROMPT_MAX_TOKENS:-16000}
      CHAT_OUTPUT_MAX_TOKENS: ${CHAT_OUTPUT_MAX_TOKENS:-2048}
      CHAT_RUN_TIMEOUT_MS: ${CHAT_RUN_TIMEOUT_MS:-120000}
      CHAT_PROVIDER_TIMEOUT_MS: ${CHAT_PROVIDER_TIMEOUT_MS:-60000}
      CHAT_PROVIDER_MAX_RETRIES: ${CHAT_PROVIDER_MAX_RETRIES:-1}
      CHAT_MAX_EXECUTING_RUNS_PER_INSTANCE: ${CHAT_MAX_EXECUTING_RUNS_PER_INSTANCE:-4}
      CHAT_LEASE_MS: ${CHAT_LEASE_MS:-30000}
      CHAT_HEARTBEAT_MS: ${CHAT_HEARTBEAT_MS:-5000}
      CHAT_SWEEP_INTERVAL_MS: ${CHAT_SWEEP_INTERVAL_MS:-5000}
      CHAT_SNAPSHOT_INTERVAL_MS: ${CHAT_SNAPSHOT_INTERVAL_MS:-500}
      CHAT_AGENT_MAX_STEPS: ${CHAT_AGENT_MAX_STEPS:-6}
      CHAT_TOOL_MAX_CALLS: ${CHAT_TOOL_MAX_CALLS:-8}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-10}
      CHAT_MAX_ACTIVE_RUNS_PER_USER: ${CHAT_MAX_ACTIVE_RUNS_PER_USER:-2}
      CHAT_MAX_ACTIVE_RUNS_GLOBAL: ${CHAT_MAX_ACTIVE_RUNS_GLOBAL:-20}
      CHAT_CANCEL_POLL_MS: ${CHAT_CANCEL_POLL_MS:-1000}
      CHAT_CANCEL_GRACE_MS: ${CHAT_CANCEL_GRACE_MS:-5000}
      CHAT_STREAM_BUFFER_MAX_BYTES: ${CHAT_STREAM_BUFFER_MAX_BYTES:-262144}
      CHAT_IDEMPOTENCY_RETENTION_HOURS: ${CHAT_IDEMPOTENCY_RETENTION_HOURS:-168}
      SOURCE_PDF_MAX_BYTES: ${SOURCE_PDF_MAX_BYTES:-26214400}
      USAGE_MODULES_WEEKLY_LIMIT: ${USAGE_MODULES_WEEKLY_LIMIT:-10}
      USAGE_SOURCES_WEEKLY_LIMIT: ${USAGE_SOURCES_WEEKLY_LIMIT:-40}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_READ_MAX: ${RATE_LIMIT_READ_MAX:-120}
      RATE_LIMIT_MUTATION_MAX: ${RATE_LIMIT_MUTATION_MAX:-60}
      RATE_LIMIT_EXPENSIVE_MAX: ${RATE_LIMIT_EXPENSIVE_MAX:-10}
      RATE_LIMIT_STREAM_MAX: ${RATE_LIMIT_STREAM_MAX:-10}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *service
    image: ${BACKEND_IMAGE:?Set registry image prefix}-worker:${RELEASE_TAG:?Set immutable commit tag}
    environment:
      <<: *infrastructure
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OpenAI key}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-1536}
      KNOWLEDGE_INDEX_VERSION: ${KNOWLEDGE_INDEX_VERSION:-1}
      KNOWLEDGE_CHUNK_TOKENS: ${KNOWLEDGE_CHUNK_TOKENS:-600}
      KNOWLEDGE_CHUNK_OVERLAP_TOKENS: ${KNOWLEDGE_CHUNK_OVERLAP_TOKENS:-80}
      KNOWLEDGE_SEARCH_CANDIDATES: ${KNOWLEDGE_SEARCH_CANDIDATES:-20}
      KNOWLEDGE_SEARCH_TOP_K: ${KNOWLEDGE_SEARCH_TOP_K:-6}
      KNOWLEDGE_RRF_K: ${KNOWLEDGE_RRF_K:-60}
      KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:-32}
      KNOWLEDGE_INDEX_CONCURRENCY: ${KNOWLEDGE_INDEX_CONCURRENCY:-2}
      KNOWLEDGE_RECONCILE_INTERVAL_MS: ${KNOWLEDGE_RECONCILE_INTERVAL_MS:-60000}
      KNOWLEDGE_OBSOLETE_RETENTION_HOURS: ${KNOWLEDGE_OBSOLETE_RETENTION_HOURS:-24}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set validated model}
      AI_IMAGE_INPUT_ENABLED: ${AI_IMAGE_INPUT_ENABLED:-true}
      WIKIMEDIA_USER_AGENT: ${WIKIMEDIA_USER_AGENT:-NgertiinLessonImages/1.0 (https://ngertiin.whoismanik.dev)}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Set Mistral key}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:?Set Firecrawl key}
      SOURCE_URL_MAX_CODE_POINTS: ${SOURCE_URL_MAX_CODE_POINTS:-500000}

  # Explicit release step; never start migrations on ordinary app restarts.
  migrate:
    image: ${BACKEND_IMAGE:?Set registry image prefix}-migrate:${RELEASE_TAG:?Set immutable commit tag}
    profiles: [release]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set internal PostgreSQL URL}
    networks:
      - backend

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:?Set network shared with Dokploy databases}
