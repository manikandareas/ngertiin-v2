name: Build backend release images
run-name: "backend release=${{ inputs.release_id || 'manual' }} sha=${{ inputs.release_sha || github.sha }}"
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full candidate commit SHA (optional for manual runs)
        type: string
        required: false
      release_id:
        description: Unique coordinator release ID
        type: string
        required: false
permissions:
  contents: read
  packages: write
concurrency:
  group: backend-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Resolve checked out release
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ -n "$REQUESTED_SHA" && ( ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ || "$sha" != "$REQUESTED_SHA" ) ]]; then
            echo 'release_sha must match the full checked out commit SHA.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run db:check
      - run: docker compose --env-file .env.production.example -f compose.production.yml --profile release config --quiet
  images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, migrate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Resolve checked out release
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          sha="$(git rev-parse HEAD)"
          if [[ -n "$REQUESTED_SHA" && ( ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ || "$sha" != "$REQUESTED_SHA" ) ]]; then
            echo 'release_sha must match the full checked out commit SHA.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.prefix }}-${{ matrix.target }}:${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
