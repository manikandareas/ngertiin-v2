rid;gap:8px}.result-options li{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:16px;font-size:14px}.letter{background:var(--line);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:800}.result-options li.correct-choice{border-color:#58cc02;background:var(--green)}.result-options li.wrong-choice{border-color:#b4231870;background:#b423180a}.answer-tag{font-size:11px;font-weight:800;margin-left:auto;white-space:nowrap}.status-good{background:var(--green)}.status-partial{background:var(--yellow)}.status-wrong{background:#b423181a;color:#b42318}.status-badge{font-size:11px;border-radius:8px;padding:6px 9px;font-weight:850}.result-feedback{padding:14px 24px;border-top:1px solid var(--line);font-size:12px}.result-explanation{border-top:1px solid var(--line);padding:14px 24px;font-size:14px}.result-explanation summary{cursor:pointer;color:var(--deep);font-weight:800}.result-explanation p{margin-top:12px}.result-list{display:grid;gap:20px}.revisit a{color:var(--muted);font-size:12px;line-height:1.6;display:block;margin-top:12px;text-decoration:none}.revisit a:hover{text-decoration:underline}.result-answer{margin-top:20px;background:var(--line);padding:16px;border-radius:16px;font-size:14px}.dock-label{min-width:0}.dock{white-space:nowrap}.question{scroll-margin-top:100px}@media(max-width:760px){.detail-grid{grid-template-columns:1fr}.detail-grid>aside{max-width:240px;margin:auto}.start-strip{align-items:flex-start;flex-direction:column}.result-grid{grid-template-columns:1fr}.result-summary{position:static}.view-toolbar{align-items:flex-start;flex-direction:column}.all-questions .question{padding:20px}.result-options li{flex-wrap:wrap}.result-options li>span:nth-child(2){flex:1;min-width:130px}.detail-title{font-size:26px}.dock{width:auto;min-width:320px}.result-body{padding:20px}.result-summary .score{margin-bottom:20px}}
.view-toolbar{position:sticky;top:76px;z-index:4;background:var(--bg);padding:14px 0}.all-questions .question{scroll-margin-top:185px}@media(max-width:760px){.view-toolbar{top:68px}.view-toolbar>div:first-child{display:none}.all-questions .question{scroll-margin-top:155px}}
.question-header{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:16px;font-weight:600;line-height:1.4}.question-header .flag-action{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;padding:0;font-size:24px;font-weight:400;color:var(--muted)}.question-header .flag-action[aria-pressed=true]{color:var(--deep);background:var(--soft)}.save:empty{display:none}.question h2{margin-top:18px}
</style></head><body><div id="app"></div><div id="dock" class="dock" aria-label="Kontrol prototype"></div><dialog id="confirm"><h2>Kirim exam sekarang?</h2><p id="confirm-copy"></p><div class="row"><button onclick="document.querySelector('dialog').close()">Periksa lagi</button><button class="primary" onclick="finish()">Ya, kirim jawaban</button></div></dialog>
<script>
const params=new URLSearchParams(location.search);let variant='B';let view=params.get('view')==='list'?'list':'focus';let screen=['detail','attempt','result'].includes(params.get('screen'))?params.get('screen'):'detail';let pos=0,answers={},flags=new Set(),deadline=null,finished=false,expired=false;const names={A:'Focus',B:'Navigator',C:'Sprint'};
const questions=[
{q:'Ketika harga suatu barang naik, apa yang biasanya terjadi pada jumlah permintaannya?',o:['Jumlah permintaan menurun','Jumlah permintaan meningkat','Jumlah permintaan tetap','Permintaan selalu menjadi nol'],a:0,e:'Menurut hukum permintaan, harga dan jumlah yang diminta berhubungan terbalik, dengan faktor lain tetap.'},
{q:'Pendapatan konsumen dapat memengaruhi permintaan suatu barang.',o:['Benar','Salah'],a:0,e:'Perubahan pendapatan dapat menggeser kurva permintaan.'},
{q:'Faktor mana yang dapat menggeser kurva penawaran ke kanan?',o:['Biaya produksi meningkat','Teknologi produksi lebih efisien','Jumlah produsen berkurang','Pajak produksi meningkat'],a:1,e:'Teknologi yang lebih efisien memungkinkan produsen menawarkan lebih banyak pada setiap tingkat harga.'},
{q:'Jelaskan dengan kata-katamu sendiri apa yang dimaksud dengan harga keseimbangan.',e:'Harga keseimbangan terbentuk saat jumlah yang diminta sama dengan jumlah yang ditawarkan.'},
{q:'Jika harga berada di atas harga keseimbangan, pasar cenderung mengalami…',o:['Kelangkaan barang','Kelebihan penawaran','Keseimbangan baru secara otomatis','Peningkatan permintaan'],a:1,e:'Harga di atas keseimbangan menghasilkan jumlah penawaran yang melebihi permintaan.'},
{q:'Kenaikan harga barang substitusi bisa meningkatkan permintaan barang lain yang menjadi penggantinya.',o:['Benar','Salah'],a:0,e:'Konsumen dapat beralih ke barang pengganti yang relatif lebih murah.'},
{q:'Manakah contoh barang komplementer?',o:['Teh dan kopi','Beras dan jagung','Printer dan tinta','Bus dan kereta'],a:2,e:'Barang komplementer digunakan bersama, seperti printer dan tinta.'},
{q:'Permintaan disebut elastis ketika…',o:['Jumlah permintaan tidak berubah','Perubahan jumlah permintaan relatif lebih besar daripada perubahan harga','Harga selalu meningkat','Penawaran melebihi permintaan'],a:1,e:'Permintaan elastis peka terhadap perubahan harga.'},
{q:'Beri contoh bagaimana perubahan selera dapat memengaruhi permintaan.',e:'Misalnya tren hidup sehat meningkatkan permintaan buah pada berbagai tingkat harga.'},
{q:'Dengan faktor lain tetap, bertambahnya jumlah produsen dapat meningkatkan penawaran pasar.',o:['Benar','Salah'],a:0,e:'Lebih banyak produsen dapat menambah total barang yang ditawarkan.'}];
const answered=()=>Object.values(answers).filter(x=>String(x).trim()!=='').length;const has=i=>answers[i]!==undefined&&String(answers[i]).trim()!=='';const secs=()=>deadline?Math.max(0,Math.ceil((deadline-Date.now())/1000)):1800;const time=()=>Math.floor(secs()/60)+':'+String(secs()%60).padStart(2,'0');
function updateURL(){history.replaceState(null,'','?'+new URLSearchParams({screen,view}))}
function go(s){screen=s;if(s==='attempt'&&!deadline&&!finished)deadline=Date.now()+1800000;updateURL();render();window.scrollTo(0,0)}
function start(){if(finished){answers={};flags.clear();pos=0;finished=false;expired=false;deadline=null}go('attempt')}
function setView(v){view=v;updateURL();render();if(v==='list')document.getElementById('question-'+pos)?.scrollIntoView({block:'start'});else window.scrollTo(0,0)}
function numbers(){return `<nav class="numbers" aria-label="Nomor soal">${questions.map((q,i)=>`<button class="num ${has(i)?'answered':''} ${i===pos?'current':''} ${flags.has(i)?'flag':''}" aria-label="Soal ${i+1}${has(i)?', terjawab':', kosong'}${flags.has(i)?', ditandai':''}" ${i===pos?'aria-current="step"':''} onclick="move(${i})">${i+1}</button>`).join('')}</nav>`}
function move(i){pos=i;if(view==='focus')render();else{refreshProgress();document.getElementById('question-'+i)?.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('title-'+i)?.focus({preventScroll:true})}}
function flag(i){flags.has(i)?flags.delete(i):flags.add(i);const b=document.querySelector(`[data-flag="${i}"]`);if(b){b.textContent=flags.has(i)?'⚑':'⚐';b.setAttribute('aria-pressed',flags.has(i));b.title=flags.has(i)?'Hapus tanda':'Tandai soal';b.setAttribute('aria-label',b.title+' '+(i+1))}refreshProgress()}
function refreshProgress(){document.querySelectorAll('[data-count]').forEach(e=>e.textContent=answered());document.querySelectorAll('[data-empty]').forEach(e=>e.textContent=10-answered());const nav=document.querySelector('.navigator .numbers');if(nav)nav.outerHTML=numbers();const bar=document.querySelector('.progress i');if(bar)bar.style.width=answered()*10+'%'}
function answer(i,v){if(finished||secs()===0)return;answers[i]=v;pos=i;document.querySelector(`[data-save="${i}"]`).textContent=has(i)?'✓ Jawaban tersimpan · simulasi lokal':'';refreshProgress()}
function ask(){document.querySelector('#confirm-copy').textContent=`${answered()} dari 10 soal terjawab. ${10-answered()} soal masih kosong. Setelah dikirim, jawaban tidak dapat diubah.`;document.querySelector('dialog').showModal()}
function finish(){document.querySelector('dialog').close();finished=true;go('result')}
function timer(){return `<span class="timer ${secs()<=300?'urgent':''}" role="timer" aria-label="Sisa waktu">◷ <span data-time>${time()}</span></span>`}
function header(){return `<header class="top"><div class="row"><button class="ghost" aria-label="Kembali ke detail" onclick="go('detail')">←</button><span class="brand">ngerti.in</span></div><span class="top-title">Permintaan, penawaran & keseimbangan</span><div class="row">${screen==='attempt'&&!finished?timer():`<span class="pill">EXAM</span>`}<button class="ghost" aria-label="Ganti tema" onclick="document.body.classList.toggle('dark')">◐</button></div></header>${screen==='attempt'?`<div class="progress"><i style="width:${answered()*10}%"></i></div>`:''}`}
function detail(){return `<main class="wrap"><p class="muted" style="font-size:14px">← Kembali ke Latihan</p><div class="detail-grid"><aside><div class="preview-card"><div class="paper-preview"><div class="paper"><div class="row between"><span style="font-family:serif;font-size:18px">Uji pemahaman</span><small>30 menit</small></div><hr><small>Bagian 01 / Pemahaman konsep</small><p style="margin-top:15px">01. ${questions[0].q}</p><hr><hr></div></div><h3 style="margin:16px 5px 10px;font-size:16px">Permintaan, penawaran & keseimbangan</h3><small>Exam · 10 soal · 30 menit</small></div><p class="muted" style="font-size:12px;text-align:center;margin-top:16px">Dibuat 26 September 2026</p></aside><section><span class="pill" style="background:var(--yellow);color:var(--ink)">▤ Exam</span><h1 class="detail-title" style="margin-top:16px">Permintaan, penawaran & keseimbangan</h1><p class="muted" style="font-size:14px;margin-top:12px">Menguji pemahaman tentang hukum permintaan dan penawaran, keseimbangan pasar, serta faktor yang memengaruhinya.</p><div class="detail-meta"><span>▤ 10 soal</span><span>▥ Menengah</span><span>◷ 30 menit</span></div><div class="start-strip"><div><h3>${deadline&&!finished?'Lanjutkan sesi belajarmu':'Siapkan waktu 30 menit.'}</h3><p class="muted" style="margin-top:6px">Timer berjalan sejak exam dimulai, termasuk saat halaman ditutup.</p></div><button class="primary" onclick="start()">${deadline&&!finished?'Lanjutkan':'Mulai exam'} →</button></div><h3>Isi latihan</h3><div class="chips"><span>5 pilihan ganda</span><span>3 benar / salah</span><span>2 esai singkat</span><span>Bahasa Indonesia</span></div><section style="margin-top:32px"><h3>Riwayat belajar <small>1 sesi contoh${deadline&&!finished?' · 1 sesi aktif':''}</small></h3>${deadline&&!finished?`<button class="history-row row between" onclick="go('attempt')"><span>◷ Sesi saat ini<br><small>Sedang dikerjakan · waktu terus berjalan</small></span><span>Lanjutkan →</span></button>`:''}<button class="history-row row between" onclick="go('result')"><div>✓ &nbsp; 26 Sep 2026, 09.30<br><small>Selesai · contoh riwayat</small></div><div style="text-align:right">80/100 →<br><small>nilai akhir</small></div></button></section></section></div>${info()}</main>`}
function question(i){let q=questions[i];return `<article class="question" id="question-${i}"><header class="question-header"><span>${i+1}. ${!q.o?'Jawaban Singkat':q.o.length===2?'Benar atau Salah':'Pilihan Ganda'}</span><button data-flag="${i}" class="ghost flag-action" title="${flags.has(i)?'Hapus tanda':'Tandai soal'}" aria-label="${flags.has(i)?'Hapus tanda':'Tandai soal'} ${i+1}" onclick="flag(${i})" aria-pressed="${flags.has(i)}">${flags.has(i)?'⚑':'⚐'}</button></header><h2 id="title-${i}" tabindex="-1">${q.q}</h2>${q.o?`<fieldset class="options" aria-labelledby="title-${i}">${q.o.map((o,j)=>`<label class="option"><input type="radio" name="answer-${i}" value="${j}" ${answers[i]===j?'checked':''} onchange="answer(${i},${j})"><span>${o}</span></label>`).join('')}</fieldset>`:`<textarea data-answer="${i}" aria-labelledby="title-${i}" maxlength="4000" oninput="answer(${i},this.value)" placeholder="Tulis pemahamanmu dengan kata-katamu sendiri…"></textarea>`}<p class="save" data-save="${i}" role="status">${has(i)?'✓ Jawaban tersimpan · simulasi lokal':''}</p>${view==='focus'?`<footer class="qfooter"><button ${i===0?'disabled':''} onclick="move(pos-1)">← Sebelumnya</button><button class="primary" onclick="${i===9?'ask()':'move(pos+1)'}">${i===9?'Periksa & kirim':'Berikutnya →'}</button></footer>`:''}</article>`}
function map(){return `<aside class="card navigator stack"><div class="row between"><h3>Peta soal</h3><small><span data-count>${answered()}</span>/10</small></div>${numbers()}<small>Biru: terjawab · Titik: ditandai</small><div class="rule"><b><span data-empty>${10-answered()}</span> soal belum dijawab</b><p class="muted" style="font-size:13px">${view==='list'?'Klik nomor untuk menuju soal.':'Kamu bisa kembali ke soal mana pun.'}</p></div><button style="width:100%" onclick="ask()">Periksa & kirim</button></aside>`}
function attempt(){if(finished)return result();return `<main class="wrap"><div class="view-toolbar"><div><h3>Kerjakan sesuai ritmemu.</h3><p class="muted" style="font-size:13px">${view==='focus'?'Satu soal setiap langkah.':'Semua soal dalam satu halaman.'} Jawaban tersimpan otomatis.</p></div><div class="segmented" role="group" aria-label="Tampilan soal"><button aria-pressed="${view==='focus'}" onclick="setView('focus')">▣ Fokus</button><button aria-pressed="${view==='list'}" onclick="setView('list')">☷ Semua soal</button></div></div><div class="split"><section>${view==='focus'?question(pos):`<div class="all-questions">${questions.map((_,i)=>question(i)).join('')}</div><div class="qfooter"><small><span data-count>${answered()}</span>/10 soal terjawab</small><button class="primary" onclick="ask()">Periksa & kirim →</button></div>`}</section>${map()}</div>${info()}</main>`}
function resultQuestion(q,i){const correct=i!==3&&i!==4&&i!==8,wrong=i===4,selected=wrong?0:q.a;return `<article id="result-${i}" class="card result-card"><div class="result-body"><div class="row between" style="margin-bottom:16px"><small><b>#${i+1}</b> &nbsp; ${!q.o?'Jawaban singkat':q.o.length===2?'Benar atau salah':'Pilihan ganda'}</small><span class="status-badge ${correct?'status-good':wrong?'status-wrong':'status-partial'}">${correct?'✓ Benar':wrong?'× Salah':'◐ Sebagian benar'}</span></div><h3 style="line-height:1.6">${q.q}</h3>${q.o?`<ul class="result-options">${q.o.map((o,j)=>`<li class="${j===selected?(correct?'correct-choice':'wrong-choice'):''}"><span class="letter">${String.fromCharCode(65+j)}</span><span>${o}</span>${j===selected?'<span class="answer-tag">Jawabanmu</span>':''}</li>`).join('')}</ul>`:`<div class="result-answer"><small>Jawabanmu</small><p>${i===3?'Harga yang disepakati oleh pembeli dan penjual.':'Saat makanan sehat populer, orang membeli lebih banyak buah.'}</p></div>`}</div><div class="result-feedback row between"><span class="muted">${correct?'Jawabanmu sudah tepat.':'Pelajari kembali materi, lalu coba lagi.'}</span><b>Skor: ${correct?'1':wrong?'0':'0,5'} / 1</b></div>${correct?`<details class="result-explanation"><summary>Penjelasan</summary><p class="muted">${q.e}</p></details>`:''}</article>`}
function result(){return `<main class="wrap"><header style="margin-bottom:30px"><p class="muted" style="font-size:12px">Hasil exam</p><h2 style="margin-top:8px;font-size:30px;font-weight:850">Permintaan, penawaran & keseimbangan</h2><p class="muted" style="font-size:14px;margin-top:8px">10 soal · Selesai${expired?' · Waktu habis':''}</p><small>Contoh hasil · bukan penilaian jawaban demo</small></header><div class="result-grid"><aside class="card result-summary"><div class="score"><div><strong>80<small>/100</small></strong><small>Nilai exam</small></div></div><h3>Ringkasan hasil</h3><div class="row between" style="margin-top:16px"><span class="muted">🟢 Benar</span><b>7</b></div><div class="row between" style="margin-top:10px"><span class="muted">🟡 Sebagian benar</span><b>2</b></div><div class="row between" style="margin-top:10px"><span class="muted">🔴 Salah</span><b>1</b></div><div class="row between" style="border-top:1px solid var(--line);padding-top:16px;margin-top:20px"><span>XP diperoleh</span><span class="pill">+30 XP</span></div><section class="revisit" style="border-top:1px solid var(--line);padding-top:20px;margin-top:20px"><h3 style="font-size:14px">Perlu dipelajari lagi</h3><a href="#result-4">Soal 5 · ${questions[4].q}</a></section></aside><section aria-label="Hasil per soal" class="result-list">${questions.map(resultQuestion).join('')}</section></div>${info()}</main>`}
function info(){return `<p class="demo-info">PROTOTYPE · Navigator / ${screen}${screen==='attempt'?' / '+view:''} · Data contoh<br>Timer dan jawaban demo di memori; reload mereset sesi. Produksi memakai deadline server.</p>`}
function render(){document.body.classList.remove('A','B','C');document.querySelector('#app').innerHTML=header()+(screen==='detail'?detail():screen==='attempt'?attempt():result());document.querySelectorAll('textarea[data-answer]').forEach(e=>e.value=answers[Number(e.dataset.answer)]??'');document.querySelector('#dock').innerHTML=`<small>PROTOTYPE</small><span class="dock-label">Exam</span><span class="divider"></span>${['detail','attempt','result'].map(s=>`<button class="${screen===s?'active':''}" onclick="go('${s}')">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}<button onclick="deadline=Date.now()+10000;finished=false;go('attempt')">Timer 10s</button>`}
setInterval(()=>{if(!deadline||finished)return;document.querySelectorAll('[data-time]').forEach(e=>{e.textContent=time();e.parentElement.classList.toggle('urgent',secs()<=300)});if(secs()===0){expired=true;finish()}},250);
if(screen==='attempt')deadline=Date.now()+1800000;render();
</script></body></html>
