const typeTag=s=>`<span class="type">${icon(s.type)}${labels[s.type]}</span>`;
const title=s=>`<h2><button type="button" class="title" data-open="${s.id}">${s.title}</button></h2>`;
function card(s){
const excerpt=s.status==='ready'?s.excerpt:s.status==='processing'?'Sedang menyiapkan bahan belajarmu…':'Tautan ini belum berhasil dibaca.';
const footer=`<div class="object-footer"><span>${s.type==='pdf'?s.meta:s.origin}</span><button type="button" class="open" data-open="${s.id}" aria-label="Lihat materi: ${s.title}">${icon('arrow')}</button></div>`;
const art=`<div class="art" aria-hidden="true">${icon('web')}</div>`;
let content='';
if(variant===1){
if(s.type==='pdf')content=`${typeTag(s)}${title(s)}<p class="meta">${s.origin}</p><p class="excerpt">${excerpt}</p>${footer}`;
if(s.type==='web')content=`${typeTag(s)}<span class="doodle" aria-hidden="true">↗</span>${title(s)}<p class="excerpt">${excerpt}</p>${footer}`;
if(s.type==='text')content=`${typeTag(s)}${title(s)}<p class="excerpt">${excerpt}</p>${footer}`;
}else if(variant===2){
if(s.type==='pdf')content=`${typeTag(s)}${title(s)}<div class="seal" aria-hidden="true">BIO / XI</div><p class="meta">${s.origin}</p>${footer}`;
if(s.type==='web')content=`${art}${typeTag(s)}${title(s)}<p class="excerpt">${excerpt}</p>${footer}`;
if(s.type==='text')content=`${typeTag(s)}${title(s)}<p class="excerpt">${excerpt}</p>${footer}`;
}else{
if(s.type==='pdf')content=`${typeTag(s)}${title(s)}<p class="meta">${s.origin}</p>${footer}`;
if(s.type==='web')content=`${art}${typeTag(s)}${title(s)}${footer}`;
if(s.type==='text')content=`${typeTag(s)}<span class="doodle" aria-hidden="true">✎</span>${title(s)}<p class="excerpt">${excerpt}</p>${footer}`;
}
return `<article class="source ${s.type}"><div class="object">${content}</div><div class="under"><span class="status ${s.status}">${statuses[s.status]}</span><span>${s.date}</span></div></article>`;
}
function render(){const q=document.querySelector('#search').value.toLowerCase(),type=document.querySelector('#type').value;const items=sources.filter(s=>Boolean(s.archived)===(collection==='archived')&&(type==='all'||s.type===type)&&`${s.title} ${s.origin}`.toLowerCase().includes(q));grid.className=`grid v${variant}`;grid.innerHTML=items.length?items.map(card).join(''):'<div class="empty"><strong>Belum ada materi yang cocok</strong><p>Coba kata kunci atau jenis materi lain.</p></div>';document.querySelectorAll('[data-variant]').forEach(b=>{b.setAttribute('aria-pressed',String(Number(b.dataset.variant)===variant))});document.querySelector('#counter').textContent=`${items.length} materi · ${collection==='active'?'Aktif':'Arsip'}`;document.querySelector('#description').textContent=['PDF bertumpuk · Web berupa tiket · Teks sticky note','PDF buku saku · Web kartu pos · Teks sobekan jurnal','PDF binder · Web jendela lengkung · Teks buku spiral'][variant-1]}
function change(v){variant=(v+2)%3+1;const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.querySelectorAll('[data-variant]').forEach(b=>{b.onclick=()=>change(Number(b.dataset.variant))});document.querySelector('#prev').onclick=()=>change(variant-1);document.querySelector('#next').onclick=()=>change(variant+1);document.querySelectorAll('[data-collection]').forEach(b=>{b.onclick=()=>{collection=b.dataset.collection;document.querySelectorAll('[data-collection]').forEach(t=>{t.setAttribute('aria-pressed',String(t===b))});render()}});document.querySelector('#search').oninput=render;document.querySelector('#type').onchange=render;
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||document.querySelector('dialog[open]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();change(variant+(e.key==='ArrowRight'?1:-1))}});
const dialog=document.querySelector('#preview');grid.onclick=e=>{const btn=e.target.closest('[data-open]');if(!btn)return;const s=sources.find(s=>s.id===Number(btn.dataset.open));document.querySelector('#preview-content').innerHTML=`${typeTag(s)}<h2 id="preview-title">${s.title}</h2><span class="status ${s.status}">${statuses[s.status]}</span><p>${s.status==='ready'?s.excerpt:s.status==='failed'?'Tautan belum berhasil diproses. Pada aplikasi, kamu dapat mencoba memprosesnya kembali.':'Materi sedang disiapkan. Cuplikan akan tersedia setelah selesai.'}</p><p class="meta">${s.origin} · ${s.meta}</p><p class="dialog-note">Pratinjau simulasi · Seluruh isi merupakan data contoh.</p>`;dialog.showModal()};dialog.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
let toastTimer;document.querySelector('#add').onclick=()=>{document.querySelector('#toast').textContent='Prototype item materi — penambahan materi belum disimulasikan.';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{document.querySelector('#toast').textContent=''},3200)};render();
</script></body></html>
